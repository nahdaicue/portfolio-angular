<div *ngIf="isLoading" class="has-text-centered mt-6">
  <p class="has-text-grey">⏳ Cargando...</p>
</div>

<div *ngIf="error" class="has-text-centered mt-6">
  <p class="has-text-danger">⚠️ {{ error }}</p>
</div>

<ng-container *ngIf="portfolio && !isLoading">
  <section class="section">
    <div class="container">
      <h1 class="title has-text-centered">Proyectos</h1>
      <p class="subtitle has-text-centered">
        Algunos proyectos en los que trabajé
      </p>

      <div class="columns is-multiline">
        <div class="column is-4" *ngFor="let project of portfolio!.projects">
          <div class="card">

            <div class="card-image" *ngIf="project.imageUrls.length > 0">
              <figure class="image is-4by3">
                <img [src]="project.imageUrls[0]" [alt]="project.nameProject" />
              </figure>
            </div>

            <div class="card-content">
              <p class="title is-5">{{ project.nameProject }}</p>
              <p class="content">{{ project.description }}</p>
              <div class="tags">
                <span class="tag is-primary" *ngFor="let lang of project.languages">
                  {{ lang }}
                </span>
              </div>
            </div>

            <footer class="card-footer">
              <a *ngIf="project.urlDemo"
                class="card-footer-item"
                [href]="project.urlDemo"
                target="_blank">Demo</a>

              <a *ngIf="project.urlGitFront"
                class="card-footer-item"
                [href]="project.urlGitFront"
                target="_blank">Front</a>

              <a *ngIf="project.urlGitBack"
                class="card-footer-item"
                [href]="project.urlGitBack"
                target="_blank">Back</a>

              <a *ngIf="project.urlPublicFront"
                class="card-footer-item"
                [href]="project.urlPublicFront"
                target="_blank">Ver sitio</a>
            </footer>

          </div>
        </div>
      </div>

      <div *ngIf="portfolio!.projects.length === 0" class="has-text-centered mt-6">
        <p class="has-text-grey">No hay proyectos cargados aún.</p>
      </div>

    </div>
  </section>
</ng-container>
